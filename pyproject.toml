[project]
name = "edgememory"
version = "0.0.1"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long literals (seed narratives) stay intact

[tool.pytest.ini_options]
testpaths = ["tests"]
